name: Selenium Multi-Browser Automation Suite

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-automation:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox, edge]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4.2.2

    - name: Set up Python
      uses: actions/setup-python@v5.4.0
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # Instalăm pachetele Python esențiale pentru suite
        pip install selenium pytest pytest-html pytest-xdist requests pytest-bdd allure-pytest jsonschema Pillow

    - name: Setup Microsoft Edge
      if: matrix.browser == 'edge'
      uses: browser-actions/setup-edge@v1
      with:
        edge-version: stable

    - name: Run Selenium Tests
      run: |
        mkdir -p raport allure-results
        # Rulăm PyTest în interiorul serverului virtual Xvfb pre-instalat nativ pe imaginea Ubuntu
        xvfb-run --server-args="-screen 0 1024x768x24" python -m pytest tests/ --browser ${{ matrix.browser }} --html=raport/raport_teste.html --self-contained-html --alluredir=allure-results

    - name: Upload Standard Test Report Artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: raport-teste-${{ matrix.browser }}
        path: raport/raport_teste.html
        retention-days: 5

    - name: Upload Raw Allure Results Artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: allure-results-${{ matrix.browser }}
        path: allure-results/
        retention-days: 5

  performance-testing:
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4.2.2

    - name: Set up Python
      uses: actions/setup-python@v5.4.0
      with:
        python-version: '3.12'

    - name: Install Performance Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests locust

    - name: Run Headless Locust Stress Test
      run: |
        mkdir -p performance-results
        # Executăm testul de stres timp de 45 de secunde cu 30 de utilizatori virtuali concurenți
        locust -f performance/locustfile.py --headless -u 30 -r 3 --run-time 45s --host https://reqres.in --html performance-results/raport_stres.html

    - name: Upload Performance Report Artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: raport-performanta-locust
        path: performance-results/raport_stres.html
        retention-days: 5

  deploy-reports:
    # FIXED: Jobul de deployment așteaptă acum finalizarea ambelor suite (UI Automation + Performance Testing)
    needs: [test-automation, performance-testing]
    runs-on: ubuntu-22.04
    if: always() && !cancelled()
    permissions:
      contents: write

    steps:
    - name: Checkout repository source code
      uses: actions/checkout@v4.2.2

    - name: Checkout existing gh-pages branch to preserve history
      uses: actions/checkout@v4.2.2
      with:
        ref: gh-pages
        path: gh-pages-root
      continue-on-error: true

    - name: Download all Artifacts from previous jobs
      uses: actions/download-artifact@v4
      with:
        path: downloaded-results

    - name: Set up Java Environment for Allure CLI
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install Allure Commandline Tool via NPM
      run: |
        sudo npm install -g allure-commandline --unsafe-perm=true

    - name: Build Structure and Inject History
      run: |
        mkdir -p public-site/chrome public-site/firefox public-site/edge public-site/performance
        
        # Copiem fișierul index.html din rădăcină în folderul public final
        cp index.html public-site/index.html || true
        
        # FIXED: Mutăm raportul static generat de Locust direct în structura publică de pagini
        cp downloaded-results/raport-performanta-locust/raport_stres.html public-site/performance/index.html || true
        
        # Injectăm istoricul Allure din rulările anterioare salvate pe gh-pages
        if [ -d "gh-pages-root/chrome/history" ]; then cp -r gh-pages-root/chrome/history downloaded-results/allure-results-chrome/history || true; fi
        if [ -d "gh-pages-root/firefox/history" ]; then cp -r gh-pages-root/firefox/history downloaded-results/allure-results-firefox/history || true; fi
        if [ -d "gh-pages-root/edge/history" ]; then cp -r gh-pages-root/edge/history downloaded-results/allure-results-edge/history || true; fi
        
        # Compilăm rapoartele statice Allure pentru fiecare browser
        allure generate downloaded-results/allure-results-chrome -o public-site/chrome --clean
        allure generate downloaded-results/allure-results-firefox -o public-site/firefox --clean
        allure generate downloaded-results/allure-results-edge -o public-site/edge --clean

    - name: Deploy Compiled Reports to GitHub Pages
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./public-site
        keep_files: false
