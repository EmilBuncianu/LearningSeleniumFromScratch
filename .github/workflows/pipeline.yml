name: Selenium Multi-Browser Automation Suite

# The pipeline triggers automatically on every push or pull request to the main branch
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-automation:
    runs-on: ubuntu-latest

    # The matrix launches 3 isolated containers running simultaneously
    strategy:
      fail-fast: false  # If one browser fails, the others continue running
      matrix:
        browser: [chrome, firefox, edge]

    steps:
    # 1. Clones the code from your repository into the runner container
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. Configures Python (sets up a clean environment for execution)
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    # 3. Installs all required dependencies for your ecosystem
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install selenium pytest pytest-html pytest-xdist requests pytest-bdd webdriver-manager

    # 4. Sets up Microsoft Edge using official stable PPA
    - name: Setup Microsoft Edge
      if: matrix.browser == 'edge'
      run: |
        sudo apt-get update
        sudo apt-get install -y curl gnupg xvfb
        
        # Create a secured directory for repository keys
        sudo mkdir -p /etc/apt/keyrings
        
        # Download Microsoft signing key securely
        curl -fsSL https://microsoft.com | sudo gpg --dearmor -o /etc/apt/keyrings/microsoft.gpg
        
        # Inject the repository definition pointing directly to the trusted key
        echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/microsoft.gpg] https://microsoft.com stable main" | sudo tee /etc/apt/sources.list.d/microsoft-edge.list
        
        # Update and deploy the stable web browser instance
        sudo apt-get update
        sudo apt-get install -y microsoft-edge-stable

    # 5. Executes tests in parallel, using xvfb to simulate a virtual display buffer (required for Edge on Linux)
    # and explicitly sets the unique output path for the report
    - name: Run Selenium Tests
      run: |
        xvfb-run --server-args="-screen 0 1024x768x24" python -m pytest --browser ${{ matrix.browser }} --html=raport/raport_teste.html --self-contained-html

    # 6. Extracts the interactive report from the container (even if tests fail)
    - name: Upload Test Report
      if: always() # Required to ensure the report can be downloaded even on failures
      uses: actions/upload-artifact@v4
      with:
        name: raport-teste-${{ matrix.browser }}
        path: raport/raport_teste.html
        retention-days: 5
