name: Selenium Multi-Browser Automation Suite

# The pipeline triggers automatically on every push or pull request to the main branch
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-automation:
    runs-on: ubuntu-latest

    # The matrix launches 3 isolated containers running simultaneously
    strategy:
      fail-fast: false  # If one browser fails, the others continue running
      matrix:
        browser: [chrome, firefox, edge]

    steps:
    # 1. Clones the code from your repository into the runner container
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. Configures Python (sets up a clean environment for execution)
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    # 3. Installs all required dependencies for your ecosystem
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install selenium pytest pytest-html pytest-xdist requests pytest-bdd

    - name: Setup Microsoft Edge (pentru job-ul de Edge)
      if: matrix.browser == 'edge'
      uses: browser-actions/setup-edge@v1
      with:
        edge-version: stable

    # 4. Executes tests in parallel, explicitly setting the unique output path for the report
    - name: Run Selenium Tests
      run: |
        python -m pytest --browser ${{ matrix.browser }} --html=raport/raport_teste.html --self-contained-html


    # 5. Extracts the interactive report from the container (even if tests fail)
    - name: Upload Test Report
      if: always() # Required to ensure the report can be downloaded even on failures
      uses: actions/upload-artifact@v4
      with:
        name: raport-teste-${{ matrix.browser }}
        path: raport/raport_teste.html
        retention-days: 5
