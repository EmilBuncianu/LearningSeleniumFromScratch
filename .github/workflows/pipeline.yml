name: Selenium Multi-Browser Automation Suite

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-automation:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox, edge]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4.2.2

    - name: Set up Python
      uses: actions/setup-python@v5.4.0
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # FIXED: Am eliminat complet orice comanda apt-get pentru a preveni blocarea in fundal a containerului
        pip install selenium pytest pytest-html pytest-xdist requests pytest-bdd allure-pytest

    - name: Setup Microsoft Edge
      if: matrix.browser == 'edge'
      uses: browser-actions/setup-edge@v1
      with:
        edge-version: stable

    - name: Run Selenium Tests
      run: |
        mkdir -p raport allure-results
        # xvfb-run este apelat direct, fiind deja integrat nativ in imaginea ubuntu-22.04 oferita de GitHub
        xvfb-run --server-args="-screen 0 1024x768x24" python -m pytest tests/ --browser ${{ matrix.browser }} --html=raport/raport_teste.html --self-contained-html --alluredir=allure-results

    - name: Upload Standard Test Report Artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: raport-teste-${{ matrix.browser }}
        path: raport/raport_teste.html
        retention-days: 5

    - name: Upload Raw Allure Results Artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: allure-results-${{ matrix.browser }}
        path: allure-results/
        retention-days: 5

  deploy-reports:
    needs: test-automation
    runs-on: ubuntu-22.04
    if: always() && !cancelled()
    permissions:
      contents: write

    steps:
    - name: Checkout repository source code
      uses: actions/checkout@v4.2.2

    - name: Checkout existing gh-pages branch to preserve history
      uses: actions/checkout@v4.2.2
      with:
        ref: gh-pages
        path: gh-pages-root
      continue-on-error: true

    - name: Download all Allure Artifacts from previous job
      uses: actions/download-artifact@v4
      with:
        path: downloaded-results

    - name: Set up Java Environment for Allure CLI
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install Allure Commandline Tool via NPM
      run: |
        sudo npm install -g allure-commandline --unsafe-perm=true

    - name: Build Structure and Inject History
      run: |
        mkdir -p public-site/chrome public-site/firefox public-site/edge
        
        # Injectăm dinamic un dashboard curat în rădăcina site-ului dacă index.html local nu este prezent
        if [ -f "index.html" ]; then
          cp index.html public-site/index.html
        else
          cat << 'EOF' > public-site/index.html
          <!DOCTYPE html>
          <html lang="en">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>QA Automation - Test Execution Dashboard</title>
              <style>
                  :root { --bg: #f4f6f9; --card: #fff; --text: #2d3748; --muted: #718096; --shadow: 0 4px 6px rgba(0,0,0,0.05); }
                  body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 40px 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
                  header { text-align: center; margin-bottom: 40px; }
                  h1 { font-size: 2.5rem; margin: 0 0 10px 0; color: #1a202c; }
                  .container { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; width: 100%; max-width: 900px; }
                  .card { background: var(--card); border-radius: 12px; box-shadow: var(--shadow); padding: 30px; text-align: center; display: flex; flex-direction: column; justify-content: space-between; position: relative; }
                  .card::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 6px; border-radius: 12px 12px 0 0; }
                  .chrome::before { background: #4285F4; } .firefox::before { background: #FF7139; } .edge::before { background: #0078D7; }
                  .btn { display: inline-block; text-decoration: none; padding: 12px; color: #fff; border-radius: 8px; font-weight: 600; margin-top: 20px; }
                  .chrome .btn { background: #4285F4; } .firefox .btn { background: #FF7139; } .edge .btn { background: #0078D7; }
              </style>
          </head>
          <body>
              <header>
                  <h1>Test Automation Reports</h1>
                  <p>Select a targeted browser execution path below to view the interactive live Allure Dashboard</p>
              </header>
              <div class="container">
                  <div class="card chrome">
                      <h2>Google Chrome</h2>
                      <p>UI and API testing suite metrics executed inside clean Chromium environments.</p>
                      <a href="./chrome/" class="btn">Open Report</a>
                  </div>
                  <div class="card firefox">
                      <h2>Mozilla Firefox</h2>
                      <p>Cross-browser UI scenarios verified over standard GeckoDriver engine runtimes.</p>
                      <a href="./firefox/" class="btn">Open Report</a>
                  </div>
                  <div class="card edge">
                      <h2>Microsoft Edge</h2>
                      <p>Modular functional tests deployed over specialized enterprise Linux architectures.</p>
                      <a href="./edge/" class="btn">Open Report</a>
                  </div>
              </div>
          </body>
          </html>
          EOF
        fi
        
        # Recuperăm istoricul Allure din gh-pages în rezultatele noi descărcate
        if [ -d "gh-pages-root/chrome/history" ]; then cp -r gh-pages-root/chrome/history downloaded-results/allure-results-chrome/history || true; fi
        if [ -d "gh-pages-root/firefox/history" ]; then cp -r gh-pages-root/firefox/history downloaded-results/allure-results-firefox/history || true; fi
        if [ -d "gh-pages-root/edge/history" ]; then cp -r gh-pages-root/edge/history downloaded-results/allure-results-edge/history || true; fi
        
        # Generăm rapoartele statice Allure pentru fiecare browser din matrix
        allure generate downloaded-results/allure-results-chrome -o public-site/chrome --clean
        allure generate downloaded-results/allure-results-firefox -o public-site/firefox --clean
        allure generate downloaded-results/allure-results-edge -o public-site/edge --clean

    - name: Deploy Compiled Reports to GitHub Pages
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./public-site
        keep_files: false
