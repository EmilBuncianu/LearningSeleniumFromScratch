name: Selenium Multi-Browser Automation Suite

# Pipeline-ul se va declanșa automat la fiecare push pe branch-ul main
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-automation:
    runs-on: ubuntu-latest

    # Matricea lansează 3 containere izolate care rulează în același timp
    strategy:
      fail-fast: false  # Dacă un browser eșuează, celelalte continuă rularea
      matrix:
        browser: [chrome, firefox, edge]

    steps:
    # 1. Copiază codul din repository-ul tău în containerul de rulare
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. Configurează Python (mediul curat pentru rulare)
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    # 3. Instalează toate librăriile menționate în ecosistemul tău
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install selenium pytest pytest-html pytest-xdist requests

    - name: Setup Microsoft Edge (pentru job-ul de Edge)
      if: matrix.browser == 'edge'
      uses: browser-actions/setup-edge@v1
      with:
        edge-version: stable

    # 4. Execută testele în paralel (-n auto) injectând dinamic browserul curent din matrice
    # comanda preia configurările stabilite în pytest.ini-ul tău
    - name: Run Selenium Tests
      run: |
        python -m pytest --browser ${{ matrix.browser }}

    # 5. Extrage raportul interactiv din container (chiar dacă testele pică)
    - name: Upload Test Report
      if: always() # Obligatoriu, ca să poți descărca raportul chiar și la erori
      uses: actions/upload-artifact@v4
      with:
        name: raport-teste-${{ matrix.browser }}
        path: raport/raport_teste.html
        retention-days: 5
